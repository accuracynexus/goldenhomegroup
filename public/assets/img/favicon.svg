<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Golden Home Group">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8861A"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8861A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0B0B0C"/>

  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Techo -->
    <path d="M7 40 32 19l25 21"/>
    <!-- Base -->
    <path d="M7 53q25-9 50 0"/>
  </g>

  <!-- Chimenea -->
  <rect x="19" y="18" width="5" height="10" rx="1.5" fill="url(#gold)"/>

  <!-- Ventana (4 paños) -->
  <g fill="url(#gold)">
    <rect x="25" y="30" width="6" height="6" rx="1"/>
    <rect x="33" y="30" width="6" height="6" rx="1"/>
    <rect x="25" y="38" width="6" height="6" rx="1"/>
    <rect x="33" y="38" width="6" height="6" rx="1"/>
  </g>
</svg>
